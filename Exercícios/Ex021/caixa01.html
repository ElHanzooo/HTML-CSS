<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        body {
            background-color: black;
        }

        h1 {
            background-color: lightgray;
            height: 300px;
            width: 300px;

            border: 5px solid black;
            /* largura - estilo - cor */

            padding: 10px;
            /* cima - direita - baixo - esquerda */

            margin: auto;

            outline: 5px solid darkgray;
            /* largura - estilo - cor */
        }
    </style>
</head>
<body>
    <div>
        <h1>Exemplo de caixa box-level com a tag &lt;h1&gt;.</h1>
    </div>
</body>
</html>
