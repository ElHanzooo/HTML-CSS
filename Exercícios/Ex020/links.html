<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        a {
            color: black;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: gray;
        }

        a:hover {
            text-decoration: underline;
            color: lightgray;
        }

        a:active {
            text-decoration: underline;
            color: darkgray;
        }
    </style>
</head>
<body>
    <h1>Links</h1>
    <hr>
    <ul>
        <li><a href="https://www.facebook.com">Link 1</a></li>
        <li><a href="https://www.youtube.com">Link 2</a></li>
        <li><a href="https://www.scratch.mit.edu">Link 3</a></li>
    </ul>
</body>
</html>
