<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos e Quebras de Linha</title>
</head>
<body>
    <h1>Parágrafos e Quebras de Linha</h1>
    <hr>
    <p>Você pode escrever um parágrafo de qualquer jeito, basta colocá-lo em um par de tags &lt;p&gt; e &lt;/p&gt;.</p>
    <!-- LESS THAN / GREATHER THAN -->
    <p>Se você precisa quebrar o texto em algum lugar específico, <br>basta quebrá-lo com a tag &lt;br&gt;.</p>
    <p>Símbolos especiais: &reg; &copy; &trade; &euro; &pound; &yen; &cent; &delta; &Delta; &uarr;</p>
    <p>Emojis: &#x1FAE9 &#x1FAF6</p>
</body>
</html>
