<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário</h1>
    <hr>
    <form action="cadastro.cs" method="get" autocomplete="on"">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <div>
                <label for="ie-mail">E-mail:</label>
                <input type="email" name="email" id="ie-mail" autocomplete="email">
            </div>
            <div>
                <label for="itelefone">Telefone:</label>
                <input type="tel" name="telefone" id="itelefone" autocomplete="tel" pattern="^\([0-9{2}]\)[0-9]{4,5}-[0-9]{4}$">
            </div>
        </fieldset>
        <div style="padding-top: 10px">
            <input type="reset" value="Limpar">
            <input type="submit" value="Enviar">
        </div>
    </form>
</body>
</html>
