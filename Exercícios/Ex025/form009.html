<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Formulários</h1>
    <hr>
    <form action="" method="get">
        <div>
            <p>Número 1:</p>

            <input type="range" name="num" id="inum" oninput="ival.innerHTML = Number(inum.value)" min="0" max="10" value="5">
            <output id="ival">5</output>
        </div>
        
        <div>
            <br>

            <input type="submit">
            <input type="reset">
        </div>
    </form>
</body>
</html>
