<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Formulários</h1>
    <hr>
    <form action="" method="get">
        <div>
            <p>Em que ano você nasceu?</p>

            <input type="number" name="ano" id="iano" oninput="calcIdade()">

            <p>Sua idade é:</p>
            <output id="iidade">0</output>
        </div>
    </form>

    <script>
        function calcIdade() {
            let atual = new Date().getFullYear()
            iidade.innerHTML = Number(atual) - Number(iano.value)
        }
    </script>
</body>
</html>
