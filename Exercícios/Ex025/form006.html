<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Formulários</h1>
    <hr>
    <form action="#" autocomplete="on" method="get">
        <div>
            <p>Input para cores:</p>

            <label for="icor">Cor: </label>
            <input type="color" name="cor" id="icor">
        </div>

        <div>
            <p>Input para intervalos:</p>

            <label for="iintervalo">Intervalo: </label>
            <input type="range" name="intervalo" id="iintervalo">
        </div>

        <div>
            <p>Input para arquivos:</p>

            <label for="iarquivo">Arquivo: </label>
            <input type="file" name="arquivo" id="iarquivo">
        </div>

        <div>
            <br>
            
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
</body>
</html>
