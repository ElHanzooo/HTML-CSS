<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Formulários</h1>
    <hr>
    <form action="" autocomplete="on" method="get">
        <fieldset>
            <legend>Gênero</legend>
            <input type="radio" name="Gênero" id="Masculino" checked> <label for="Masculino">Masculino</label> <br>
            <input type="radio" name="Gênero" id="Feminina"> <label for="Feminina">Feminina</label> <br>
            <input type="radio" name="Gênero" id="Prefiro não dizer"> <label for="Prefiro não dizer">Prefiro não dizer</label> <br>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <input type="checkbox" name="Futebol" id="Futebol" checked> <label for="Futebol">Futebol</label> <br>
            <input type="checkbox" name="Capoeira" id="Capoeira"> <label for="Capoeira">Capoeira</label> <br>
            <input type="checkbox" name="Natação" id="Natação"> <label for="Natação">Natação</label> <br>
            <input type="checkbox" name="Vôlei" id="Vôlei"> <label for="Vôlei">Volêi</label> <br>
            <input type="checkbox" name="Jiu-Jitsu" id="Jiu-Jitsu"> <label for="Jiu-Jitsu">Jiu-Jitsu</label> <br>
            <input type="checkbox" name="Musculação" id="Musculação"> <label for="Musculação">Musculação</label> <br>
            <input type="checkbox" name="Karatê" id="Karatê"> <label for="Karatê">Karatê</label> <br>
            <input type="checkbox" name="Boxe" id="Boxe"> <label for="Boxe">Boxe</label> <br>
            <input type="checkbox" name="Aikidô" id="Aikidô"> <label for="Aikidô">Aikidô</label> <br>
        </fieldset>

        <div>
            <input type="submit" value="Enviar">
            <input type="submit" value="Limpar">
        </div>
    </form>
</body>
</html>
