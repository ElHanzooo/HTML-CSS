<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        caption {
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }

        .cnome {
            background-color: chartreuse;
        }
    </style>
</head>
<body>
    <table>
    <colgroup>
        <col class="cnome">
        <col class="csexo">
        <col class="cidade">
        <col class="cprof">
    </colgroup>
    <caption>Cadastro</caption>
    <tr>
        <th scope="col">Nome</th>
        <th scope="col">Sexo</th>
        <th scope="col">Idade</th>
        <th scope="col">Profissão</th>
    </tr>
    <tr>
        <td>Ana Maria</td>
        <td>F</td>
        <td>25</td>
        <td>Jornalista</td>
    </tr>
    <tr>
        <td>João Silva</td>
        <td>M</td>
        <td>32</td>
        <td>Engenheiro</td>
    </tr>
    <tr>
        <td>Mariana Souza</td>
        <td>F</td>
        <td>28</td>
        <td>Designer</td>
    </tr>
    <tr>
        <td>Carlos Oliveira</td>
        <td>M</td>
        <td>41</td>
        <td>Professor</td>
    </tr>
    <tr>
        <td>Fernanda Lima</td>
        <td>F</td>
        <td>35</td>
        <td>Médica</td>
    </tr>
    <tr>
        <td>Rafael Costa</td>
        <td>M</td>
        <td>29</td>
        <td>Desenvolvedor</td>
    </tr>
    <tr>
        <td>Patrícia Gomes</td>
        <td>F</td>
        <td>38</td>
        <td>Advogada</td>
    </tr>
    <tr>
        <td>Joanderson</td>
        <td>M</td>
        <td>17</td>
        <td>Desenvolvedor C#</td>
    </tr>
</table>
</body>
</html>
