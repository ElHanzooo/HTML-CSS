<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <h1>Listas</h1>
    <hr>
    <h2>Listas Ordenadas</h2>
    <ol type="a" start="5">
        <li>Item</li>
        <li>Item</li>
        <li>Item</li>
    </ol>
    <h2>Listas Não Ordenadas</h2>
    <ul type="disc">
        <li>Item</li>
        <li>Item</li>
        <li>Item</li>
    </ul>
    <h2>Listas Mistas</h2>
    <ol>
        <li>Item</li>
        <ol>
            <li>Item</li>
            <li>Item</li>
            <li>Item</li>
        </ol>
        <ul>
            <li>Item</li>
            <li>Item</li>
            <li>Item</li>
        </ul>
    </ol>
    <h2>Listas de Definição</h2>
    <dl>
        <dt>Termo</dt>
        <dd>Descrição</dd>
    </dl>
</body>
</html>
