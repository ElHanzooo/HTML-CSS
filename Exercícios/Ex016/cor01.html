<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cores</title>
</head>
<body>
    <h1>Cores</h1>
    <hr>
    <p style="background-color: black; color: white;">Exemplo de cor usando nomes (black e white)</p>
    <p style="background-color: #000000; color: #ffffff;">Exemplo de cor usando o formato hexadecimal (#000000 e #ffffff)</p>
    <p style="background-color: rgb(0, 0, 0); color: rgb(255, 255, 255)">Exemplo de cor usando o formato RGB (0, 0, 0 e 255, 255, 255)</p>
    <p style="background-color: hsl(0, 0%, 0%); color: hsl(0, 0%, 100%);">Exemplo de cor usando o formato HSL (0, 0% e 0% e 0, 0% e 100%)</p>
</body>
</html>
